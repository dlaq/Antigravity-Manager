name: Promote verified Manager v4.9.4 image

on:
  push:
    branches: [upgrade/manager-v4.9.4-prefill-fix]
    paths:
      - ".github/workflows/promote-manager-v4.9.4.yml"

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME_SECRET: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_USERNAME_VAR: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_USERNAME_SECRET: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_USERNAME_VAR: ${{ vars.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  DOCKERHUB_IMAGE_VAR: ${{ vars.DOCKERHUB_IMAGE }}
  DOCKERHUB_REPOSITORY_VAR: ${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve Docker Hub credentials and image name
        id: docker
        shell: bash
        run: |
          set -euo pipefail

          username="${DOCKERHUB_USERNAME_SECRET:-${DOCKERHUB_USERNAME_VAR:-${DOCKER_USERNAME_SECRET:-${DOCKER_USERNAME_VAR:-}}}}"
          token="${DOCKERHUB_TOKEN:-${DOCKERHUB_ACCESS_TOKEN:-${DOCKERHUB_PASSWORD:-${DOCKER_PASSWORD:-${DOCKER_TOKEN:-}}}}}"

          if [ -z "$username" ] || [ -z "$token" ]; then
            echo "::error::Docker Hub credentials are not configured."
            exit 1
          fi

          image="${DOCKERHUB_IMAGE_VAR:-${DOCKERHUB_REPOSITORY_VAR:-$username/antigravity-manager}}"
          image="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')"

          echo "::add-mask::$token"
          printf '%s' "$token" | docker login --username "$username" --password-stdin
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify tested source manifest
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.docker.outputs.image }}"
          for tag in v4.9.4-assistant-prefill-fix-test assistant-prefill-fix-v4.9.4-test; do
            docker buildx imagetools inspect "$image:$tag" | tee "/tmp/$tag.inspect"
            grep -Fq 'Platform:    linux/amd64' "/tmp/$tag.inspect"
            grep -Fq 'Platform:    linux/arm64' "/tmp/$tag.inspect"
          done

      - name: Promote verified multi-arch manifests
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.docker.outputs.image }}"
          docker buildx imagetools create \
            --tag "$image:v4.9.4-assistant-prefill-fix" \
            "$image:v4.9.4-assistant-prefill-fix-test"
          docker buildx imagetools create \
            --tag "$image:assistant-prefill-fix" \
            "$image:assistant-prefill-fix-v4.9.4-test"

      - name: Verify promoted manifests
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.docker.outputs.image }}"
          for tag in v4.9.4-assistant-prefill-fix assistant-prefill-fix; do
            docker buildx imagetools inspect "$image:$tag" | tee "/tmp/$tag.inspect"
            grep -Fq 'Platform:    linux/amd64' "/tmp/$tag.inspect"
            grep -Fq 'Platform:    linux/arm64' "/tmp/$tag.inspect"
          done

      - name: Publish promotion summary
        run: |
          {
            echo "## Promoted verified Manager image"
            echo
            echo 'Stable tags:'
            echo '- v4.9.4-assistant-prefill-fix'
            echo '- assistant-prefill-fix'
            echo
            echo "Platforms: linux/amd64, linux/arm64"
            echo "Source tags were verified before promotion."
          } >> "$GITHUB_STEP_SUMMARY"
