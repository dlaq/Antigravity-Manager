name: Promote AIStudioToAPI v1.4.0

on:
  push:
    branches: [upgrade/manager-v4.9.6-prefill-fix]
    paths:
      - ".github/workflows/promote-aistudio-v1.4.0.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME_SECRET: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_USERNAME_VAR: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_USERNAME_SECRET: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_USERNAME_VAR: ${{ vars.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  DOCKERHUB_IMAGE_VAR: ${{ vars.DOCKERHUB_IMAGE }}
  DOCKERHUB_REPOSITORY_VAR: ${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve Docker Hub credentials and image name
        id: docker
        shell: bash
        run: |
          set -euo pipefail

          username="${DOCKERHUB_USERNAME_SECRET:-${DOCKERHUB_USERNAME_VAR:-${DOCKER_USERNAME_SECRET:-${DOCKER_USERNAME_VAR:-}}}}"
          token="${DOCKERHUB_TOKEN:-${DOCKERHUB_ACCESS_TOKEN:-${DOCKERHUB_PASSWORD:-${DOCKER_PASSWORD:-${DOCKER_TOKEN:-}}}}}"

          if [ -z "$username" ]; then
            echo "::error::Docker Hub username is not configured."
            exit 1
          fi
          if [ -z "$token" ]; then
            echo "::error::Docker Hub credential is not configured."
            exit 1
          fi

          image="${DOCKERHUB_IMAGE_VAR:-${DOCKERHUB_REPOSITORY_VAR:-$username/aistudio-to-api}}"
          image="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')"

          echo "::add-mask::$token"
          printf '%s' "$token" | docker login --username "$username" --password-stdin
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify source manifests
        env:
          IMAGE: ${{ steps.docker.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.4.0-assistant-prefill-fix-test assistant-prefill-fix-v1.4.0-test; do
            manifest="$(docker buildx imagetools inspect "$IMAGE:$tag")"
            printf '%s\n' "$manifest" | grep -q 'linux/amd64'
            printf '%s\n' "$manifest" | grep -q 'linux/arm64'
          done

      - name: Promote verified manifests
        env:
          IMAGE: ${{ steps.docker.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$IMAGE:v1.4.0-assistant-prefill-fix" \
            "$IMAGE:v1.4.0-assistant-prefill-fix-test"
          docker buildx imagetools create \
            -t "$IMAGE:assistant-prefill-fix" \
            "$IMAGE:assistant-prefill-fix-v1.4.0-test"
