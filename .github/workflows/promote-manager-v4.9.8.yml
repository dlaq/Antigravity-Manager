name: Promote Manager beta.10 image

on:
  push:
    branches: [upgrade/manager-v4.9.8-beta.10-prefill-fix]
    paths:
      - ".github/workflows/promote-manager-v4.9.8.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKERHUB_USERNAME_SECRET: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_USERNAME_VAR: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_USERNAME_SECRET: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_USERNAME_VAR: ${{ vars.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  DOCKERHUB_IMAGE_VAR: ${{ vars.DOCKERHUB_IMAGE }}
  DOCKERHUB_REPOSITORY_VAR: ${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve Docker Hub credentials and image name
        id: docker
        shell: bash
        run: |
          set -euo pipefail

          username="${DOCKERHUB_USERNAME_SECRET:-${DOCKERHUB_USERNAME_VAR:-${DOCKER_USERNAME_SECRET:-${DOCKER_USERNAME_VAR:-}}}}"
          token="${DOCKERHUB_TOKEN:-${DOCKERHUB_ACCESS_TOKEN:-${DOCKERHUB_PASSWORD:-${DOCKER_PASSWORD:-${DOCKER_TOKEN:-}}}}}"

          if [ -z "$username" ]; then
            echo "::error::Docker Hub username is not configured."
            exit 1
          fi
          if [ -z "$token" ]; then
            echo "::error::Docker Hub credential is not configured."
            exit 1
          fi

          image="${DOCKERHUB_IMAGE_VAR:-${DOCKERHUB_REPOSITORY_VAR:-$username/antigravity-manager}}"
          image="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')"

          echo "::add-mask::$token"
          printf '%s' "$token" | docker login --username "$username" --password-stdin
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote verified beta.10 manifest
        shell: bash
        env:
          IMAGE: ${{ steps.docker.outputs.image }}
          SOURCE_DIGEST: sha256:d8faf414d801c8782f0585682ccfc71f8cc1e0d5b241d3f63a3b60fb3071b3ea
        run: |
          set -euo pipefail

          source_tag="v4.9.8-beta.10-assistant-prefill-fix-test"
          observed="$(docker buildx imagetools inspect "$IMAGE:$source_tag" | awk '/^Digest:/ { print $2; exit }')"
          test "$observed" = "$SOURCE_DIGEST"

          docker buildx imagetools create \
            --tag "$IMAGE:v4.9.8-beta.10-assistant-prefill-fix" \
            "$IMAGE@$SOURCE_DIGEST"
          docker buildx imagetools create \
            --tag "$IMAGE:assistant-prefill-fix-v4.9.8-beta.10" \
            "$IMAGE@$SOURCE_DIGEST"

      - name: Verify promoted manifests
        shell: bash
        env:
          IMAGE: ${{ steps.docker.outputs.image }}
        run: |
          set -euo pipefail
          for tag in \
            v4.9.8-beta.10-assistant-prefill-fix \
            assistant-prefill-fix-v4.9.8-beta.10; do
            docker buildx imagetools inspect "$IMAGE:$tag"
            docker buildx imagetools inspect "$IMAGE:$tag" | grep -Eq 'Platform: +linux/amd64'
            docker buildx imagetools inspect "$IMAGE:$tag" | grep -Eq 'Platform: +linux/arm64'
          done
